name: family_vault

description: "A secure, local-first private family information and document management application."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  file_picker: ^8.0.0
  path_provider: ^2.1.2
  intl: ^0.19.0
  flutter_riverpod: ^2.5.1
  go_router: ^17.5.0
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path: ^1.9.0
  flutter_secure_storage: ^9.0.0
  uuid: ^4.3.3
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.0
  open_filex: ^4.7.0
  syncfusion_flutter_pdfviewer: ^33.2.13
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  drift_dev: ^2.16.0
  build_runner: ^2.4.8

  # App launcher icon generator
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # ============================================================
  # ASSETS
  # ============================================================

  assets:
    - assets/images/

# ==============================================================
# APP LAUNCHER ICON
# ==============================================================

flutter_launcher_icons:
  android: true
  ios: true

  # Your master 1024x1024 logo
  image_path: "assets/images/app_icon.png"

  # Android adaptive icon
  adaptive_icon_background: "#10182B"
  adaptive_icon_foreground: "assets/images/app_icon.png"

  min_sdk_android: 21